<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potato Multiview</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="grid"></main>

<div id="offline-panel" hidden></div>

<footer id="bar">
  <form id="add-form">
    <input id="add-input" placeholder="치지직 방송 주소를 붙여넣으세요" autocomplete="off">
    <button type="submit">＋ 추가</button>
  </form>
  <div id="live-chips"></div>
  <button id="offline-toggle" hidden></button>
  <button id="save">⭐ 이 구성 저장</button>
</footer>

<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
